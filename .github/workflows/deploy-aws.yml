name: deploy-aws
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - package.json
      - queue.mjs
      - server.mjs
      - test/**
      - .github/workflows/deploy-aws.yml
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: fixed-queue-aws
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show OIDC identity claims
        shell: bash
        run: |
          response="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          token="$(jq -r .value <<<"$response")"
          payload="$(cut -d. -f2 <<<"$token")"
          case $((${#payload} % 4)) in 2) payload="${payload}==";; 3) payload="${payload}=";; esac
          tr '_-' '/+' <<<"$payload" | base64 -d | jq '{sub,aud,iss}'
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/fixed-queue-server:$IMAGE_TAG" -t "$REGISTRY/fixed-queue-server:latest" .
          docker push "$REGISTRY/fixed-queue-server:$IMAGE_TAG"
          docker push "$REGISTRY/fixed-queue-server:latest"
