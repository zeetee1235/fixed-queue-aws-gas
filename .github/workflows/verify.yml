name: verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: docker build -t fixed-queue-server:test .
      - run: docker run -d --name fixed-queue-test -p 8080:8080 fixed-queue-server:test
      - run: for i in {1..20}; do curl -fsS http://127.0.0.1:8080/healthz && exit 0; sleep 1; done; exit 1
